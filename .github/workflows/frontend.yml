# Verificación del frontend en cada pull request (Amplify solo construye ramas ya fusionadas).
# El despliegue del frontend lo hace AWS Amplify con amplify.yml.
name: Frontend CI

on:
  pull_request:
    branches: [develop, qa, main]
    paths: ['frontend/**', 'amplify.yml', '.github/workflows/frontend.yml']
  push:
    branches: [develop]
    paths: ['frontend/**', 'amplify.yml', '.github/workflows/frontend.yml']

permissions:
  contents: read

jobs:
  build:
    name: Pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.ejemplo.invalid
